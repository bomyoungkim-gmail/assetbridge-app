[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assetbridge"
version = "0.0.1"
description = "AssetBridge — engine de normalização e IUP"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "sqlalchemy>=2",
  "psycopg[binary]>=3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "lxml>=5",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2",
  "psycopg-pool>=3.2",
  "langchain-ollama>=0.2",
  "httpx>=0.27",
  "polars>=1",
  "duckdb>=1",
  "pyarrow>=16",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
